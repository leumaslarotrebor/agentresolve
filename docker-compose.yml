services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-simulated}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      LLM_MAX_TOOL_ITERATIONS: ${LLM_MAX_TOOL_ITERATIONS:-8}
      REFUND_AUTO_APPROVAL_THRESHOLD_EUR: ${REFUND_AUTO_APPROVAL_THRESHOLD_EUR:-100.0}
      REPLACEMENT_WINDOW_DAYS: ${REPLACEMENT_WINDOW_DAYS:-30}
      REFUND_WINDOW_DAYS: ${REFUND_WINDOW_DAYS:-30}
      CORS_ALLOW_ORIGINS: "http://localhost:8080,http://localhost:5173"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
